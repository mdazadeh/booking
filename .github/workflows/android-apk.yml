name: Build Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: booking-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish beta15 APK as a downloadable GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-beta15]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.4.0-beta15"
          DEST="VaghYar-v1.4.0-beta15-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$DEST"
          gh release create "$TAG" "$DEST" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "VaghYar 1.4.0 beta 15 — Calendar-first Android" \
            --notes "Android test build (not production). Persian calendar-first UX, appointment sheet, Vazirmatn and paste-safe phone input. Do not uninstall old beta; export encrypted backup before restore. Login is test-only and security review pending." \
            --prerelease --latest=false
